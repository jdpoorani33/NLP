<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - NLP Student Ranking Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4 flex-grow-1" style="max-width: 800px;">

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-header bg-slate text-white p-4 rounded-top-4">
                <h4 class="fw-bold mb-1"><i class="fas fa-user-edit me-2"></i> Edit Student Record</h4>
                <p class="text-white-50 mb-0 fs-7">Update academic information or LeetCode username mapping.</p>
            </div>
            <div class="card-body p-4">

                <div class="manual-mapping-notice mb-4">
                    <i class="fas fa-shield-alt text-warning me-1"></i>
                    <strong>Manual Mapping Policy:</strong> Profile updates use only the explicitly entered username.
                </div>

                <form th:action="@{/students/save}" th:object="${studentDTO}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Register Number <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{registerNumber}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">CGPA (0.0 - 10.0) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" max="10" th:field="*{cgpa}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{department}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                            <input type="number" min="1" max="4" th:field="*{year}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Section <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{section}" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Class Assignment</label>
                        <select th:field="*{classId}" class="form-select">
                            <option value="">-- No Specific Class --</option>
                            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.className}"></option>
                        </select>
                    </div>

                    <div class="mb-4 bg-light p-3 rounded-3 border">
                        <label class="form-label fw-bold text-dark mb-1">
                            <i class="fab fa-leetcode text-warning me-1"></i> LeetCode Username
                        </label>
                        <input type="text" th:field="*{leetcodeUsername}" class="form-control" placeholder="e.g., rahulkumar123">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/students/{id}(id=*{id})}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 rounded-pill"><i class="fas fa-save me-1"></i> Update Student</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
