<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Management - NLP Student Ranking Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid px-4 py-4 flex-grow-1">

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-times-circle me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            
            <!-- Create Class Form -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-slate text-white py-3 border-0 rounded-top-4">
                        <h5 class="fw-bold mb-0"><i class="fas fa-plus-circle me-2"></i> Create New Class</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/classes/save}" th:object="${classDTO}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Class Name <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{className}" class="form-control" placeholder="e.g., B.Tech IT - III Year - A Section" required>
                                <div class="text-danger fs-7" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{department}" class="form-control" placeholder="e.g., Information Technology" required>
                                <div class="text-danger fs-7" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                                    <input type="number" min="1" max="4" th:field="*{year}" class="form-control" placeholder="3" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold">Section <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{section}" class="form-control" placeholder="A" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Academic Batch</label>
                                <input type="text" th:field="*{academicYear}" class="form-control" placeholder="e.g., 2023-2027">
                            </div>

                            <button type="submit" class="btn btn-emerald w-100 rounded-pill py-2"><i class="fas fa-save me-1"></i> Create Class</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Existing Classes List -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="fw-bold mb-0 text-dark"><i class="fas fa-chalkboard-teacher me-2 text-primary"></i> Configured Classes</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light fs-7 text-uppercase text-muted">
                                <tr>
                                    <th class="ps-4">Class Name</th>
                                    <th>Department</th>
                                    <th>Year / Sec</th>
                                    <th>Batch</th>
                                    <th>Enrolled Students</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(classes)}">
                                    <td colspan="6" class="text-center py-4 text-muted">No classes created yet. Fill the form to create your first class.</td>
                                </tr>
                                <tr th:each="c : ${classes}">
                                    <td class="ps-4 fw-bold text-dark" th:text="${c.className}">B.Tech IT - III Year - A Section</td>
                                    <td th:text="${c.department}">Information Technology</td>
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${'Yr ' + c.year + ' - ' + c.section}">Yr 3 - A</span>
                                    </td>
                                    <td th:text="${c.academicYear != null ? c.academicYear : 'N/A'}">2023-2027</td>
                                    <td>
                                        <span class="badge bg-primary rounded-pill px-3" th:text="${c.students != null ? c.students.size() : 0}">0</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/dashboard(classId=${c.id})}" class="btn btn-outline-primary" title="View Class Dashboard">
                                                <i class="fas fa-chart-line"></i> View Class
                                            </a>
                                            <form th:action="@{/classes/{id}/delete(id=${c.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this class?');">
                                                <button type="submit" class="btn btn-outline-danger" title="Delete Class">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
