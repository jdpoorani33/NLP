# Application Configuration
spring.application.name=nlp-platform
server.port=8080

# Primary Relational Database Configuration
# Default Persistence: H2 File Database (Stores all records persistently in ./data/nlp_db directory)
# For production MySQL, uncomment the MySQL section below and comment out H2.

# --- H2 FILE DATABASE (PERSISTENT ON RESTART) ---
spring.datasource.url=jdbc:h2:file:./data/nlp_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MYSQL DATABASE CONFIGURATION (UNCOMMENT FOR MYSQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/nlp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.nlp.platform=INFO
logging.level.org.hibernate.SQL=WARN
